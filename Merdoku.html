<style>
  :root {
    --surface: #18120e;
    --surface-dim: #18120e;
    --surface-bright: #3f3833;
    --surface-low: #211a16;
    --surface-container: #251e1a;
    --surface-high: #302924;
    --surface-highest: #3b332f;
    --on-surface: #ede0d9;
    --on-surface-variant: #dfbfbc;
    --outline: #a68a87;
    --outline-variant: #58413f;
    --primary: #ffb3ad;
    --on-primary: #680109;
    --primary-container: #8b1e1e;
    --secondary: #adcfb3;
    --tertiary: #eebd8e;
    --tertiary-container: #63411c;
    --bronze: #c9a84c;
    --bronze-dim: #a07830;
    --parchment: #e8dcc4;
    --parchment-dim: #c9b89a;
    --ink: #1a1008;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--surface);
    color: var(--on-surface);
    font-family: 'Newsreader', Georgia, serif;
    overflow: hidden;
  }

  #root { height: 100%; }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index: 9999;
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track {
    background: var(--surface-low);
    border-left: 1px solid var(--outline-variant);
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--bronze), var(--bronze-dim));
    border-radius: 2px;
    border: 1px solid var(--outline-variant);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--bronze); }

  /* Noise texture overlay */
  .noise::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    z-index: 1;
  }

  /* Wood grain background */
  .wood-bg {
    background-color: var(--surface);
    background-image:
      repeating-linear-gradient(
        88deg,
        transparent,
        transparent 2px,
        rgba(255,180,100,0.018) 2px,
        rgba(255,180,100,0.018) 4px
      ),
      repeating-linear-gradient(
        92deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 6px
      );
  }

  /* Filigree corner clip */
  .filigree-box {
    position: relative;
  }
  .filigree-box::before, .filigree-box::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--bronze-dim);
    border-style: solid;
    opacity: 0.7;
  }
  .filigree-box::before {
    top: 0; left: 0;
    border-width: 2px 0 0 2px;
  }
  .filigree-box::after {
    bottom: 0; right: 0;
    border-width: 0 2px 2px 0;
  }
</style>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };
  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

<script type="text/babel">

function getClanStyle(clan) {

// ─── Components ──────────────────────────────────────────────────────────────

function ClanBadge({ clan }) {
  const cs = getClanStyle(clan);
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      fontFamily: "'Noto Serif', Georgia, serif",
      fontSize: 10, fontWeight: 700, letterSpacing: '0.08em',
      textTransform: 'uppercase',
      color: 'var(--on-surface)',
      textShadow: `0 0 8px ${cs.border}cc`,
    }}>
      {clan}
    </span>);

}

function TypeBadge({ type }) {
  const color = TYPE_COLORS[type] || '#c9a84c';
  return (
    <span style={{
      display: 'inline-block',
      padding: '1px 7px',
      fontFamily: "'Noto Serif', Georgia, serif",
      fontSize: 9, fontWeight: 700, letterSpacing: '0.12em',
      textTransform: 'uppercase',
      color: '#18120e',
      background: color,
      clipPath: 'polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%)'
    }}>
      {type}
    </span>);

}

function StatPip({ label, value, color = '#ede0d9' }) {
  if (value === null || value === undefined) return null;
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      minWidth: 32
    }}>
      <span style={{
        fontFamily: "'Noto Serif', Georgia, serif",
        fontSize: 24, fontWeight: 700, lineHeight: 1,
        color: color, textShadow: `0 0 14px ${color}, 0 0 4px ${color}bb`,
      }}>{value}</span>
      <span style={{
        fontFamily: "'Noto Serif', Georgia, serif",
        fontSize: 9, fontWeight: 700, letterSpacing: '0.1em',
        textTransform: 'uppercase', color: 'var(--on-surface-variant)',
        marginTop: 2,
      }}>{label}</span>
    </div>);

}

function CardTile({ card, onSelect, selected }) {
  const cs = getClanStyle(card.clan);
  const [hovered, setHovered] = useState(false);

  return (
    <div
      onClick={() => onSelect(card)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        position: 'relative',
        cursor: 'pointer',
        background: `linear-gradient(160deg, var(--surface-bright) 0%, var(--surface-highest) 100%)`,
        border: `1px solid ${hovered || selected ? cs.border : 'var(--outline)'}`,
        boxShadow: hovered || selected ?
        `0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px ${cs.border}44, inset 0 1px 0 ${cs.border}22` :
        `0 4px 16px rgba(0,0,0,0.5)`,
        transform: hovered ? 'translateY(-3px) scale(1.01)' : selected ? 'translateY(-1px)' : 'none',
        transition: 'all 0.2s ease',
        overflow: 'hidden',
        display: 'flex', flexDirection: 'column'
      }}>

      {/* Metallic outer ring */}
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        boxShadow: `inset 0 0 0 2px ${cs.border}33`,
        zIndex: 2
      }} />

      {/* Art area */}
      <div style={{
        height: 110, position: 'relative', overflow: 'hidden',
        background: `linear-gradient(135deg, ${cs.glow} 0%, rgba(24,18,14,0.9) 60%)`,
        borderBottom: `1px solid ${cs.border}44`,
        display: 'flex', alignItems: 'center', justifyContent: 'center'
      }}>
        {card.type === 'Personality' ? (
          <>
            {/* Real art with per-card lighting variation */}
            {(() => {
              const seed = card.title.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
              const LIGHTS = [
                // warm candlelight
                { filter: 'sepia(0.3) saturate(1.1) brightness(0.88) contrast(1.08)', objectPosition: '50% 20%' },
                // cool moonlight
                { filter: 'sepia(0.1) saturate(0.85) brightness(0.82) hue-rotate(200deg) contrast(1.12)', objectPosition: '50% 15%' },
                // dramatic shadows
                { filter: 'brightness(0.72) contrast(1.25) saturate(1.2)', objectPosition: '40% 25%' },
                // crimson dusk
                { filter: 'sepia(0.4) saturate(1.3) brightness(0.85) hue-rotate(-10deg)', objectPosition: '60% 10%' },
                // pale dawn
                { filter: 'saturate(0.7) brightness(0.92) contrast(0.95)', objectPosition: '50% 30%' },
                // deep night
                { filter: 'brightness(0.65) saturate(1.4) contrast(1.3) hue-rotate(10deg)', objectPosition: '45% 20%' },
              ];
              const light = LIGHTS[seed % LIGHTS.length];
              return (
                <img
                  src="assets/card-art-personality.png"
                  alt={card.title}
                  style={{
                    position: 'absolute', inset: 0,
                    width: '100%', height: '100%',

                    objectPosition: light.objectPosition,

                    transition: 'filter 0.3s ease',
                  }}
                />

            <div style={{
              position: 'absolute', inset: 0, pointerEvents: 'none',

            <div style={{

              opacity: 0.5
            }} />
            <span style={{
              position: 'relative', zIndex: 1,

        }
      </div>

      {/* Card name ribbon */}
      <div style={{

        background: `linear-gradient(90deg, ${cs.border}28 0%, var(--surface-highest) 100%)`,

          fontStyle: 'italic', fontSize: 10,

function DeckStats({ cards }) {
  const typeCounts = cards.reduce((acc, c) => {

  return (
    <div style={{
      width: 200, flexShrink: 0,

          fontFamily: "'Noto Serif', serif",

          fontFamily: "'Newsreader', serif",

        <div style={{
          fontFamily: "'Noto Serif', serif", fontSize: 9,
          fontWeight: 700, letterSpacing: '0.12em',
          textTransform: 'uppercase', color: 'var(--outline)',
          marginBottom: 8
        }}>By Type</div>

          fontFamily: "'Noto Serif', serif", fontSize: 9,
          fontWeight: 700, letterSpacing: '0.12em',
          textTransform: 'uppercase', color: 'var(--outline)',
          margin: '10px 0 8px'
        }}>Cost Curve</div>
        {[0, 1, 2, 3, 4, 5, 6].map((cost) => {

// ─── Live Oracle fetch panel ─────────────────────────────────────────────────

function OraclePanel({ onCardsLoaded }) {
  const [query, setQuery] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  async function fetchCard() {
    if (!query.trim()) return;
    setLoading(true);
    setError(null);
    setResult(null);

    try {
      const prompt = `You are a Legend of the Five Rings CCG oracle assistant. Look up the L5R card "${query}" using the Oracle of the Void API.

API endpoint: POST https://api.oracleofthevoid.com/search
Required headers:
  accept: application/json, text/javascript, */*; q=0.01
  content-type: application/json
  origin: https://oracleofthevoid.com
  referer: https://oracleofthevoid.com/

Body (raw URL-encoded string):
  type_title=text&field_title=${encodeURIComponent(query)}&table=l5r&sort=[{"title.keyword":{"order":"asc"}}]&size=10&from=0

The response is JSON with key path hits.hits[*]._source containing fields: title, clan, type, force, chi, cost, ph, startinghonor, keywords, text, legality, printing[].

Return ONLY a valid JSON object (no markdown, no explanation) in this format:
{
  "title": "Card Name",
  "clan": "Clan Name",
  "type": "Personality|Holding|Strategy|Spell|Item|Region|Stronghold|Event",
  "cost": 0,
  "force": null,
  "chi": null,
  "ph": null,
  "startinghonor": null,
  "keywords": "keyword string",
  "text": "Card ability text",
  "flavor": "Flavor text or null",
  "set": "Set name",
  "rarity": "Common|Uncommon|Rare|Fixed"
}

If you cannot fetch from the API, use your training knowledge of L5R CCG cards to provide accurate data. Never invent fictional cards — only return data for cards that actually exist.`;

      const raw = await window.claude.complete(prompt);
      // Try to extract JSON from the response
      const jsonMatch = raw.match(/\{[\s\S]+\}/);
      if (!jsonMatch) throw new Error('No JSON found in response');
      const card = JSON.parse(jsonMatch[0]);
      setResult(card);
    } catch (e) {
      setError(`Failed to fetch card: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }

  function addToView() {
    if (result) onCardsLoaded(result);
  }

  return (
    <div style={{
      padding: '14px 16px',
      borderBottom: '1px solid var(--outline-variant)',
      background: 'linear-gradient(90deg, rgba(238,189,142,0.05) 0%, transparent 100%)'
    }}>
      <div style={{
        fontFamily: "'Noto Serif', serif",
        fontSize: 9, fontWeight: 700, letterSpacing: '0.12em',
        textTransform: 'uppercase', color: 'var(--tertiary)',
        marginBottom: 8,
        display: 'flex', alignItems: 'center', gap: 6
      }}>
        <span>⚡</span> Oracle Lookup
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && fetchCard()}
          placeholder="e.g. Bayushi Kachiko…"
          style={{
            flex: 1, padding: '6px 10px',
            fontFamily: "'Newsreader', Georgia, serif",
            fontStyle: 'italic', fontSize: 12,
            color: 'var(--on-surface)',
            background: 'var(--surface-container)',
            border: '1px solid var(--outline-variant)',
            boxShadow: 'inset 0 2px 4px rgba(0,0,0,0.4)',
            outline: 'none'
          }}
          onFocus={(e) => e.target.style.borderColor = 'var(--tertiary)'}
          onBlur={(e) => e.target.style.borderColor = 'var(--outline-variant)'} />

        <button onClick={fetchCard} disabled={loading} style={{
          padding: '6px 12px',
          fontFamily: "'Noto Serif', serif", fontSize: 9, fontWeight: 700,
          letterSpacing: '0.08em', textTransform: 'uppercase',
          color: loading ? 'var(--outline)' : '#18120e',
          background: loading ? 'var(--surface-container)' : 'linear-gradient(135deg, var(--tertiary), var(--bronze-dim))',
          border: '1px solid var(--tertiary-container)',
          cursor: loading ? 'wait' : 'pointer',
          transition: 'all 0.15s'
        }}>{loading ? '…' : 'Seek'}</button>
      </div>

      {error &&
      <div style={{
        marginTop: 8, padding: '6px 10px',
        fontFamily: "'Newsreader', serif", fontSize: 11, fontStyle: 'italic',
        color: 'var(--primary)', background: 'rgba(255,179,173,0.08)',
        border: '1px solid rgba(255,179,173,0.2)'
      }}>{error}</div>
      }

      {result &&
      <div style={{
        marginTop: 8,
        padding: '8px 10px',
        background: 'var(--surface-container)',
        border: `1px solid ${getClanStyle(result.clan).border}55`
      }}>
          <div style={{
          fontFamily: "'Noto Serif', serif", fontSize: 12, fontWeight: 700,
          color: 'var(--on-surface)'
        }}>{result.title}</div>
          <div style={{ display: 'flex', gap: 6, marginTop: 4, alignItems: 'center' }}>
            <ClanBadge clan={result.clan} />
            <TypeBadge type={result.type} />
          </div>
          <button onClick={addToView} style={{
          marginTop: 8, padding: '4px 12px',
          fontFamily: "'Noto Serif', serif", fontSize: 9,
          fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase',
          color: 'var(--secondary)', background: 'rgba(173,207,179,0.1)',
          border: '1px solid rgba(173,207,179,0.3)',
          cursor: 'pointer', width: '100%'
        }}
        onMouseEnter={(e) => e.target.style.background = 'rgba(173,207,179,0.2)'}
        onMouseLeave={(e) => e.target.style.background = 'rgba(173,207,179,0.1)'}>
          Add to Gallery</button>
        </div>
      }
    </div>);

}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [cards, setCards] = useState(SAMPLE_DECK);
  const [selectedCard, setSelectedCard] = useState(null);
  const [filter, setFilter] = useState('All');
  const [sortBy, setSortBy] = useState('type');
  const [search, setSearch] = useState('');

  const filteredCards = cards.
  filter((c) => filter === 'All' || c.type === filter).
  filter((c) => !search || c.title.toLowerCase().includes(search.toLowerCase()) || (c.text || '').toLowerCase().includes(search.toLowerCase())).
  sort((a, b) => {
    if (sortBy === 'name') return a.title.localeCompare(b.title);
    if (sortBy === 'cost') return a.cost - b.cost;
    if (sortBy === 'type') return a.type.localeCompare(b.type) || a.title.localeCompare(b.title);
    if (sortBy === 'force') return (b.force || 0) - (a.force || 0);
    if (sortBy === 'chi') return (b.chi || 0) - (a.chi || 0);
    return 0;
  });

  function addCard(card) {
    setCards((prev) => {
      if (prev.find((c) => c.title === card.title)) return prev;
      return [...prev, card];
    });
  }

  const cols = t.cardDensity === 'compact' ? 7 : t.cardDensity === 'comfortable' ? 5 : 4;

  return (
    <div style={{
      height: '100vh', display: 'flex', flexDirection: 'column',
      position: 'relative',
      backgroundImage: t.backgroundTexture === 'wood' ?
      `repeating-linear-gradient(88deg, transparent, transparent 2px, rgba(255,180,100,0.018) 2px, rgba(255,180,100,0.018) 4px), repeating-linear-gradient(92deg, transparent, transparent 3px, rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 6px)` :
      'none',
      backgroundColor: 'var(--surface)'
    }}>
      {/* Header */}
      <header style={{
        padding: '12px 24px',
        borderBottom: '1px solid var(--outline-variant)',
        background: 'linear-gradient(180deg, var(--surface-container) 0%, var(--surface-low) 100%)',
        display: 'flex', alignItems: 'center', gap: 16,
        flexShrink: 0,
        boxShadow: '0 4px 20px rgba(0,0,0,0.5)',
        position: 'relative', zIndex: 10
      }}>
        {/* Logo mark */}
        <div style={{
          width: 36, height: 36,
          border: '2px solid var(--bronze)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative',
          boxShadow: '0 0 12px rgba(201,168,76,0.3)',
          flexShrink: 0
        }}>
          <div style={{
            position: 'absolute', inset: 3,
            border: '1px solid rgba(201,168,76,0.4)'
          }} />
          <span style={{
            fontFamily: "'Noto Serif', serif", fontWeight: 700,
            fontSize: 14, color: 'var(--bronze)',
            position: 'relative', zIndex: 1
          }}>M</span>
        </div>

        <div>
          <div style={{
            fontFamily: "'Noto Serif', Georgia, serif",
            fontSize: 18, fontWeight: 700, lineHeight: 1,
            color: 'var(--on-surface)',
            letterSpacing: '-0.01em'
          }}>Merdoku</div>
          <div style={{
            fontFamily: "'Noto Serif', serif",
            fontSize: 9, fontWeight: 700, letterSpacing: '0.14em',
            textTransform: 'uppercase', color: 'var(--bronze)',
            marginTop: 2, opacity: 0.8
          }}>Relic & Ritual · L5R Grimoire</div>
        </div>

        <div style={{ flex: 1 }} />

        {/* Deck name */}
        <div style={{
          textAlign: 'right',
          fontFamily: "'Noto Serif', serif"
        }}>
          <div style={{
            fontSize: 13, fontWeight: 600, color: 'var(--on-surface)'
          }}>Scorpion Conspiracy</div>
          <div style={{
            fontSize: 9, fontWeight: 700, letterSpacing: '0.1em',
            textTransform: 'uppercase', color: 'var(--outline)',
            marginTop: 1
          }}>{cards.length} cards · Scorpion Clan</div>
        </div>

        {/* Honor track */}
        <div style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
          padding: '6px 14px',
          border: '1px solid var(--bronze-dim)',
          background: 'rgba(201,168,76,0.08)'
        }}>
          <span style={{
            fontFamily: "'Noto Serif', serif",
            fontSize: 9, fontWeight: 700, letterSpacing: '0.12em',
            textTransform: 'uppercase', color: 'var(--outline)'
          }}>Starting Honor</span>
          <span style={{
            fontFamily: "'Noto Serif', serif",
            fontSize: 22, fontWeight: 700, lineHeight: 1,
            color: 'var(--bronze)',
            textShadow: '0 0 12px rgba(201,168,76,0.4)'
          }}>6</span>
        </div>
      </header>

      {/* Body */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

        {/* Left sidebar */}
        <div style={{
          flexShrink: 0,
          borderRight: '1px solid var(--outline-variant)',
          background: 'var(--surface-low)',
          display: 'flex', flexDirection: 'column',
          overflowY: 'auto', width: "262px"
        }}>
          <OraclePanel onCardsLoaded={addCard} />
          <DeckStats cards={cards} />
        </div>

        {/* Main gallery */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
          <FilterBar
            filter={filter} setFilter={setFilter}
            sortBy={sortBy} setSortBy={setSortBy}
            search={search} setSearch={setSearch} />


          <div style={{
            flex: 1, overflowY: 'auto',
            padding: '20px 24px'
          }}>
            {/* Section groups */}
            {['Stronghold', 'Personality', 'Holding', 'Item', 'Spell', 'Strategy', 'Region', 'Event'].map((type) => {
              const typeCards = filteredCards.filter((c) => c.type === type);
              if (typeCards.length === 0) return null;
              return (
                <div key={type} style={{ marginBottom: 28 }}>
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 10,
                    marginBottom: 12
                  }}>
                    <div style={{
                      height: 1, flex: 0, width: 20,
                      background: `linear-gradient(90deg, transparent, ${TYPE_COLORS[type] || 'var(--bronze)'})`
                    }} />
                    <span style={{
                      fontFamily: "'Noto Serif', serif",
                      fontSize: 10, fontWeight: 700, letterSpacing: '0.14em',
                      textTransform: 'uppercase',
                      color: TYPE_COLORS[type] || 'var(--bronze)',
                      flexShrink: 0
                    }}>{type}s</span>
                    <div style={{
                      height: 1, flex: 1,
                      background: `linear-gradient(90deg, ${TYPE_COLORS[type] || 'var(--bronze)'}44, transparent)`
                    }} />
                    <span style={{
                      fontFamily: "'Noto Serif', serif",
                      fontSize: 10, fontWeight: 700,
                      color: 'var(--outline)'
                    }}>{typeCards.length}</span>
                  </div>

                  <div style={{
                    display: 'grid',
                    gridTemplateColumns: `repeat(${filter === 'All' ? cols : cols + 1}, 1fr)`,
                    gap: 10
                  }}>
                    {typeCards.map((card) =>
                    <CardTile
                      key={card.title}
                      card={card}
                      selected={selectedCard?.title === card.title}
                      onSelect={setSelectedCard} />

                    )}
                  </div>
                </div>);

            })}

            {filteredCards.length === 0 &&
            <div style={{
              textAlign: 'center', padding: '80px 40px',
              color: 'var(--outline)',
              fontFamily: "'Newsreader', Georgia, serif",
              fontStyle: 'italic', fontSize: 16
            }}>No relics found in the archive…</div>
            }
          </div>
        </div>

        {/* Right stats */}
      </div>

      {/* Card detail modal */}
      {selectedCard &&
      <CardDetail card={selectedCard} onClose={() => setSelectedCard(null)} />
      }

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection label="Layout">
          <TweakRadio label="Card Density" value={t.cardDensity} options={['compact', 'comfortable', 'spacious']} onChange={(v) => setTweak('cardDensity', v)} />
          <TweakToggle label="Show Flavor Text" value={t.showFlavor} onChange={(v) => setTweak('showFlavor', v)} />
          <TweakRadio label="Background" value={t.backgroundTexture} options={['wood', 'plain']} onChange={(v) => setTweak('backgroundTexture', v)} />
        </TweakSection>
        <TweakSection label="Color">
          <TweakColor label="Accent Color" value={t.accentColor} onChange={(v) => setTweak('accentColor', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>);

}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

  <rect x="80" y="20" width="50" height="70" rx="2" fill="#3f3833" stroke="#c9a84c" stroke-width="1"/>
  <rect x="140" y="20" width="50" height="70" rx="2" fill="#3f3833" stroke="#a68a87" stroke-width="1"/>
  <text x="45" y="90" font-family="serif" font-size="10" fill="#c9a84c" text-anchor="middle">M</text>
  <text x="100" y="108" font-family="serif" font-size="8" fill="#ede0d9" text-anchor="middle">Merdoku</text>
</svg>

</body>
